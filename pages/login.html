<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altacena — Login</title>
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>

    <!-- Header com a mesma estrutura e IDs do index.html -->
    <div id="header" class="header">
        <a href="../index.html">
            <img src="../img/altacena-logo.png" alt="Altacena Logo">
        </a>
        <div id="nav-options">
            <a href="../index.html#conteudo-2">EVENTOS</a>
            <a href="#">OPÇÕES</a>
            <a href="login.html">LOGIN</a>
            <a href="perfil.html">J</a>
        </div>
    </div>

    <!-- Conteúdo de Login (Wireframe) -->
    <div class="login-wrapper">
        <div class="login-box">
            <h1 class="login-titulo">Login</h1>

            <form class="login-form">
                <label for="email">E-mail:</label>
                <input type="email" id="email" class="input-wireframe">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="input-wireframe">

                <div class="esqueci-box">
                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="button" class="btn-preto">Entrar</button>

                <p class="divisor-ou">Ou</p>

                <button type="button" class="btn-preto">Cadastrar-se</button>

                <p class="aviso-sub">Caso ainda não tenha uma conta</p>
            </form>
        </div>
    </div>

</body>
</html>
